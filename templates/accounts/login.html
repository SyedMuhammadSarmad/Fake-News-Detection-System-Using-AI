{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login — Fake News Detector{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-shadow border-0">
      <div class="card-body p-4">
        <h3 class="card-title mb-1 text-center">
          <i class="bi bi-shield-lock me-2 text-primary"></i>Sign In
        </h3>
        <p class="text-muted text-center small mb-4">Fake News Detection System</p>

        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary btn-lg">Login</button>
          </div>
        </form>

        <hr>
        <p class="text-center small mb-0">
          Don't have an account?
          <a href="{% url 'register' %}">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
