{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign In — TruthLens{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:70vh;">
  <div class="col-md-4 col-sm-10">

    <div class="text-center mb-4">
      <div class="auth-icon-box">
        <i class="bi bi-shield-fill-check fs-4" style="color:var(--accent);"></i>
      </div>
      <h2 style="font-size:1.5rem;">Welcome back</h2>
      <p class="text-muted" style="font-size:.875rem;">Sign in to TruthLens</p>
    </div>

    <div class="card card-shadow">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </div>
        </form>

        <hr>
        <p class="text-center mb-0" style="font-size:.85rem;">
          <span class="text-muted">No account yet?</span>
          <a href="{% url 'register' %}" style="color:var(--accent);">Create one</a>
        </p>
      </div>
    </div>

  </div>
</div>
{% endblock %}
