{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register — TruthLens{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-sm-10">

    <div class="text-center mb-4">
      <div class="auth-icon-box" style="background:rgba(63,185,80,.1);border-color:var(--real);">
        <i class="bi bi-person-plus fs-4" style="color:var(--real);"></i>
      </div>
      <h2 style="font-size:1.5rem;">Create Account</h2>
      <p class="text-muted" style="font-size:.875rem;">
        After registering, an admin must verify your account.
      </p>
    </div>

    <div class="card card-shadow">
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-success btn-lg">
              <i class="bi bi-person-check me-2"></i>Register
            </button>
          </div>
        </form>

        <hr>
        <p class="text-center mb-0" style="font-size:.85rem;">
          <span class="text-muted">Already have an account?</span>
          <a href="{% url 'login' %}" style="color:var(--accent);">Sign in</a>
        </p>
      </div>
    </div>

  </div>
</div>
{% endblock %}
